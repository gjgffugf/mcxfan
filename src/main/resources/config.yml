# AllItemsTotem 配置
# 所有物品都可以在致命伤害时替你挡一次死亡（不死图腾同款效果），不冷却，挡完消耗该物品 1 个。

# 总开关
enabled: true

# 触发复活时是否消耗该物品（false = 无限次复活）
consume-item: true

# 是否允许消耗盔甲槽里的物品（头盔/胸甲/护腿/靴子）
include-armor: false

# 复活后恢复到的生命值（单位同游戏内血量，20 = 满血）
heal-health: 1.0

# 复活时是否清除身上已有的药水效果（原版不死图腾行为）
clear-effects: true

# 复活时是否熄灭身上的火
extinguish: true

# 复活后的无敌时间（tick）。0 = 完全无冷却，下一次致命伤害可立即再次触发
invulnerable-ticks: 0

# 是否要求玩家拥有 allitemstotem.use 权限才能触发
require-permission: false

# 不触发复活的伤害类型（原版不死图腾同样对虚空/kill 无效）
excluded-causes:
  - VOID
  - KILL

# 不能用来复活的物品材质（其他所有物品都可以）
blacklist:
  - AIR

# 复活后给予的效果
# amplifier 从 0 开始：0 = I 级，1 = II 级，2 = III 级
# 伤害吸收每级 4 点血（2 颗心）：III 级 = 12 点 = 6 颗心，比原版 II 级多 2 颗心
effects:
  regeneration:
    type: REGENERATION
    amplifier: 1
    duration: 900
  absorption:
    type: ABSORPTION
    amplifier: 2
    duration: 100
  fire_resistance:
    type: FIRE_RESISTANCE
    amplifier: 0
    duration: 800

# 物品举到眼前旋转的动画（用 ItemDisplay 模拟原版客户端动画）
animation:
  enabled: true
  # 动画时长（tick），30 = 1.5 秒
  duration-ticks: 30
  # 物品悬在眼前多远（格）
  distance: 1.25

# 粒子与音效
particles:
  enabled: true
  amount: 100
sound:
  enabled: true
